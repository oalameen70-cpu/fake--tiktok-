
This is a fully interactive cloned TikTok account creation page. It simulates the sign-up flow with real-time validation and a modern dark UI.

      gap: 8px;

      font-weight: 500;
      margin-bottom: 5px;

    }

    .input-field {

      font-size: 16px;
      color: #fff;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .input-field:focus {
      border-color: #25f4ee;
      box-shadow: 0 0 0 3px rgba(37, 244, 238, 0.15);
    }

    .input-field::placeholder {
      color: #5a5a5a;
      font-weight: 400;
    }

    .input-field.error {
      border-color: #fe2c55;
      box-shadow: 0 0 0 2px rgba(254, 44, 85, 0.2);
    }

    .input-hint {
      font-size: 12px;
      color: #777;
      padding-left: 8px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .input-hint i {
      font-size: 11px;
      color: #25f4ee;
    }

    .error-message {
      color: #fe2c55;
      font-size: 13px;
      padding-left: 8px;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .error-message i {
      font-size: 13px;
    }

    .password-row {
      display: flex;
      gap: 12px;
    }

    .password-row .input-group {
      flex: 1;
    }

    /* terms & conditions */
    .terms-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 10px 0 16px;
      padding: 0 4px;
    }

    .terms-row input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      background: #1e1e1e;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.15s;
      margin-top: 2px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .terms-row input[type="checkbox"]:checked {
      background: #25f4ee;
      border-color: #25f4ee;
    }

    .terms-row input[type="checkbox"]:checked::after {
      content: "\f00c";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      font-size: 12px;
      color: #0a0a0a;
    }

    .terms-row label {
      font-size: 13px;
      color: #aaa;
      line-height: 1.5;
      cursor: pointer;
    }

    .terms-row label a {
      color: #25f4ee;
      text-decoration: none;
      font-weight: 500;
    }
    .terms-row label a:hover {
      text-decoration: underline;
    }

      font-size: 18px;
      font-weight: 600;
      color: white;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 6px 14px rgba(254, 44, 85, 0.25);
      letter-spacing: 0.6px;
    }

    .create-btn:hover {
      background: #e01e47;
      box-shadow: 0 8px 18px rgba(254, 44, 85, 0.35);
    }

    .create-btn:active {
      transform: scale(0.97);
    }

    .create-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      background: #555;
      box-shadow: none;
    }

    /* login redirect */
    .login-redirect {
      text-align: center;
      margin-top: 22px;
      color: #8e8e8e;
      font-size: 15px;
    }

    .login-redirect a {
      color: #25f4ee;
      font-weight: 600;
      text-decoration: none;
      margin-left: 4px;
      border-bottom: 1px solid transparent;
      transition: 0.2s;
    }
    .login-redirect a:hover {
      border-bottom-color: #25f4ee;
    }

    /* footer */
    .meta-footer {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 18px;
      font-size: 11px;
      color: #4b4b4b;
